name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to destroy'
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      confirm:
        description: 'Type the environment name (e.g. dev) or "twin" / "yes" to confirm'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Destroy ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    
    steps:
      - name: Verify confirmation
        run: |
          CONFIRM_INPUT=$(echo "${{ github.event.inputs.confirm }}" | tr '[:upper:]' '[:lower:]' | xargs)
          TARGET_ENV=$(echo "${{ github.event.inputs.environment }}" | tr '[:upper:]' '[:lower:]' | xargs)
          
          if [ "$CONFIRM_INPUT" = "$TARGET_ENV" ] || \
             [ "$CONFIRM_INPUT" = "twin" ] || \
             [ "$CONFIRM_INPUT" = "yes" ] || \
             [ "$CONFIRM_INPUT" = "y" ] || \
             [ "$CONFIRM_INPUT" = "confirm" ] || \
             [ "$CONFIRM_INPUT" = "true" ]; then
            echo "✅ Destruction confirmed for environment: ${{ github.event.inputs.environment }} (input: '${{ github.event.inputs.confirm }}')"
          else
            echo "❌ Confirmation does not match!"
            echo "You entered: '${{ github.event.inputs.confirm }}'"
            echo "Expected environment '${{ github.event.inputs.environment }}', project name 'twin', or 'yes'."
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: github-actions-destroy
          aws-region: ${{ secrets.DEFAULT_AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # Important: disable wrapper to get raw outputs

      - name: Run Destroy Script
        run: |
          # Set environment variables for the script
          export AWS_ACCOUNT_ID=${{ secrets.AWS_ACCOUNT_ID }}
          export DEFAULT_AWS_REGION=${{ secrets.DEFAULT_AWS_REGION }}
          
          # Make script executable and run it
          chmod +x scripts/destroy.sh
          ./scripts/destroy.sh ${{ github.event.inputs.environment }}
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

      - name: Destruction Complete
        run: |
          echo "✅ Environment ${{ github.event.inputs.environment }} has been destroyed!"